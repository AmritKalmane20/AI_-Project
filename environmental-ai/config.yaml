# Environmental AI - Air Quality Prediction Configuration

# Project metadata
project:
  name: "environmental-ai-aq-prediction"
  version: "1.0.0"
  description: "Air Quality Index and Pollutant Forecasting using Ensemble ML"
  author: "Amrit Kalmane"
  challenge: "Embarko Student Challenge"

# Paths
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  models_dir: "models"
  logs_dir: "logs"
  outputs_dir: "outputs"
  notebooks_dir: "notebooks"

# Data configuration
data:
  # OpenAQ API settings
  openaq:
    base_url: "https://api.openaq.org/v2"
    parameters: ["pm25", "pm10", "no2", "so2", "co", "o3"]
    countries: ["US", "IN", "CN", "GB", "DE", "FR", "JP", "BR"]  # Major countries
    date_from: "2022-01-01"
    date_to: "2024-12-31"
    limit: 10000
    rate_limit: 100  # requests per minute

  # Weather API (Open-Meteo)
  weather:
    base_url: "https://archive-api.open-meteo.com/v1/archive"
    variables:
      hourly: ["temperature_2m", "relative_humidity_2m", "wind_speed_10m",
               "wind_direction_10m", "surface_pressure", "precipitation"]
    timezone: "UTC"

  # Target cities/stations (major metropolitan areas)
  targets:
    - city: "Delhi"
      country: "IN"
      lat: 28.6139
      lon: 77.2090
      station_ids: []
    - city: "Beijing"
      country: "CN"
      lat: 39.9042
      lon: 116.4074
      station_ids: []
    - city: "Los Angeles"
      country: "US"
      lat: 34.0522
      lon: -118.2437
      station_ids: []
    - city: "London"
      country: "GB"
      lat: 51.5074
      lon: -0.1278
      station_ids: []

  # Preprocessing
  preprocessing:
    resample_freq: "1H"  # Hourly frequency
    max_missing_ratio: 0.3  # Max 30% missing data per column
    interpolation_method: "time"  # Time-based interpolation
    outlier_method: "iqr"  # IQR method for outlier detection
    iqr_multiplier: 1.5

# Feature engineering
features:
  # Target variables
  targets: ["aqi", "pm25", "pm10", "no2", "so2", "co", "o3"]

  # Temporal features
  temporal:
    enabled: true
    cyclical_encoding: true  # Sin/cos for hour, day, month
    features:
      - "hour"
      - "dayofweek"
      - "month"
      - "quarter"
      - "is_weekend"
      - "is_holiday"
      - "season"

  # Lag features
  lags:
    enabled: true
    horizons: [1, 3, 6, 12, 24, 48, 72]  # Hours
    for_targets_only: false  # Also create lags for weather

  # Rolling window statistics
  rolling:
    enabled: true
    windows: [3, 6, 12, 24, 48, 72]  # Hours
    stats: ["mean", "std", "min", "max", "median"]

  # Weather features
  weather:
    enabled: true
    interactions: true  # Create interaction features
    features:
      - "temperature_2m"
      - "relative_humidity_2m"
      - "wind_speed_10m"
      - "wind_direction_10m"
      - "surface_pressure"
      - "precipitation"

  # Spatial features (multi-station)
  spatial:
    enabled: false  # Enable when multiple stations available
    max_distance_km: 50
    weight_method: "inverse_distance"

  # AQI calculation (EPA method)
  aqi:
    method: "epa"  # or "indian", "chinese", "european"
    breakpoints_file: "data/external/aqi_breakpoints_epa.csv"

# Model configurations
models:
  # XGBoost
  xgboost:
    enabled: true
    params:
      objective: "reg:squarederror"
      n_estimators: 2000
      max_depth: 8
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_weight: 3
      gamma: 0.1
      random_state: 42
      n_jobs: -1
      early_stopping_rounds: 100
      eval_metric: "mae"
    # Multi-output: train one model per target
    multioutput_strategy: "one_per_target"

  # LightGBM
  lightgbm:
    enabled: true
    params:
      objective: "regression"
      metric: "mae"
      n_estimators: 2000
      max_depth: 8
      learning_rate: 0.05
      num_leaves: 127
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_samples: 20
      random_state: 42
      n_jobs: -1
      verbose: -1
      early_stopping_rounds: 100
    multioutput_strategy: "one_per_target"

  # Temporal Transformer (Hugging Face)
  transformer:
    enabled: true
    model_name: "custom"  # Custom implementation
    params:
      d_model: 256
      n_heads: 8
      n_layers: 4
      d_ff: 1024
      dropout: 0.1
      max_seq_len: 168  # 7 days of hourly data
      prediction_horizons: [6, 12, 24, 48, 72]
    training:
      batch_size: 64
      learning_rate: 0.0001
      weight_decay: 0.01
      epochs: 100
      patience: 15
      scheduler: "cosine"
      warmup_steps: 1000
      gradient_clip: 1.0

  # Statistical baselines
  baselines:
    enabled: true
    models:
      - "persistence"  # Last value
      - "seasonal_naive"  # Same hour last week
      - "arima"  # Auto-ARIMA
      - "prophet"  # Facebook Prophet

  # Stacking Ensemble
  ensemble:
    enabled: true
    meta_learner: "ridge"  # ridge, linear, xgboost
    meta_params:
      alpha: 1.0
    use_predictions_as_features: true  # Base model predictions as features
    use_original_features: true  # Also include original features
    cv_folds: 5  # For out-of-fold predictions

# Training configuration
training:
  # Time-series cross-validation
  cv:
    method: "time_series_split"  # purged_kfold, time_series_split, expanding_window
    n_splits: 5
    test_size: 0.15  # 15% for test
    gap: 24  # Hours gap between train and test (purge)
    expanding: false  # False = sliding window, True = expanding

  # Hyperparameter tuning (Optuna)
  tuning:
    enabled: true
    n_trials: 100
    timeout: 7200  # 2 hours
    sampler: "tpe"  # tpe, random, cmaes
    pruner: "median"  # median, hyperband, none
    study_name: "aq_ensemble_tuning"
    storage: "sqlite:///logs/optuna.db"

  # Hardware
  hardware:
    use_gpu: true
    gpu_ids: [0]
    mixed_precision: true
    num_workers: 4

# Evaluation
evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "r2"
    - "mape"
    - "smape"
    - "quantile_loss"  # For prediction intervals

  horizons: [6, 12, 24, 48, 72]  # Hours ahead

  # Prediction intervals
  uncertainty:
    enabled: true
    method: "quantile_regression"  # quantile_regression, conformal, bootstrap
    quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
    confidence_levels: [0.90, 0.95]

  # Model interpretability
  interpretability:
    enabled: true
    shap:
      sample_size: 1000
      max_display: 20
    permutation_importance:
      n_repeats: 10
      n_samples: 5000

# Inference / Serving
inference:
  batch_size: 256
  model_format: "joblib"  # joblib, onnx, torchscript
  api:
    host: "0.0.0.0"
    port: 8000
    workers: 4
    timeout: 30

# Logging & Monitoring
logging:
  level: "INFO"
  format: "json"
  file: "logs/training.log"
  wandb:
    enabled: false
    project: "environmental-aq-prediction"
    entity: null
  mlflow:
    enabled: true
    tracking_uri: "file:./logs/mlruns"
    experiment_name: "aq_prediction"

# Docker
docker:
  base_image: "python:3.11-slim"
  python_version: "3.11"
  requirements: "requirements.txt"